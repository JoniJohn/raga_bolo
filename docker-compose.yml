services:

  postgres:
    image: postgres:18-alpine
    container_name: raga_postgres
    environment:
      POSTGRES_DB: raga_db
      POSTGRES_USER: raga
      POSTGRES_PASSWORD: raga_secret
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raga -d raga_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raga_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=raga_db;Username=raga;Password=raga_secret"
    ports:
      - "8080:8080"

volumes:
  postgres_data:

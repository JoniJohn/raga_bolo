name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/UnitTests/Raga.UnitTests.csproj --no-build --configuration Release --verbosity normal

      - name: Run Integration Tests
        run: dotnet test tests/IntegrationTests/Raga.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

# Local development overrides — applied automatically by `docker compose up`
services:

  postgres:
    ports:
      - "5432:5432"   # expose to host for local tooling (pgAdmin, psql, Rider)

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=raga_db;Username=raga;Password=raga_secret"
    ports:
      - "8080:8080"
      - "8081:8081"   # optional HTTPS dev port
    volumes:
      # Hot-reload friendly: mount published output (requires separate dotnet watch run)
      - ./src/Api/appsettings.Development.json:/app/appsettings.Development.json:ro

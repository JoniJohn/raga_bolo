# Local development overrides — applied automatically by `docker compose up`
services:

  postgres:
    ports:
      - "${POSTGRES_PORT}:5432"   # expose to host for local tooling (pgAdmin, psql, Rider)

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: ${ConnectionStrings__Default}
    ports:
      - "${API_PORT}:8080"
      - "${API_HTTPS_PORT}:8081"   # optional HTTPS dev port
    volumes:
      # Hot-reload friendly: mount published output (requires separate dotnet watch run)
      - ./src/Api/appsettings.Development.json:/app/appsettings.Development.json:ro
